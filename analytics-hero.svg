<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Computer screen showing analytics dashboard charts inside a circle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="disc"><circle cx="300" cy="300" r="286"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#17364a"/><stop offset=".55" stop-color="#0c1c29"/><stop offset="1" stop-color="#060d14"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddbc8"/><stop offset=".55" stop-color="#6d9bff"/><stop offset="1" stop-color="#f3b562"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddbc8"/><stop offset="1" stop-color="#2a7fb0" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b562" stop-opacity=".45"/><stop offset="1" stop-color="#f3b562" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3ddbc8" stop-opacity=".55"/><stop offset="1" stop-color="#3ddbc8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6d9bff" stop-opacity=".5"/><stop offset="1" stop-color="#6d9bff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/></pattern>
  </defs>

  <!-- disc -->
  <g clip-path="url(#disc)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect width="600" height="600" fill="url(#dots)"/>
    <circle cx="120" cy="150" r="170" fill="url(#glowA)"/>
    <circle cx="500" cy="470" r="190" fill="url(#glowB)"/>

    <!-- orbit rings -->
    <circle cx="300" cy="300" r="250" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-dasharray="3 9"/>
    <circle cx="300" cy="300" r="215" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

    <!-- monitor -->
    <g filter="url(#soft)">
      <path d="M268 410 L258 452 L342 452 L332 410 Z" fill="#14232f" stroke="#2a4150"/>
      <rect x="222" y="450" width="156" height="11" rx="5.5" fill="#1b2f3d" stroke="#2f495b"/>
      <rect x="112" y="160" width="376" height="254" rx="20" fill="#0d1a24" stroke="#35566b" stroke-width="1.5"/>
    </g>
    <rect x="126" y="174" width="348" height="226" rx="11" fill="#08121a"/>
    <rect x="126" y="174" width="348" height="226" rx="11" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- window bar -->
    <circle cx="144" cy="190" r="3.6" fill="#ff6b6b"/><circle cx="157" cy="190" r="3.6" fill="#f3b562"/><circle cx="170" cy="190" r="3.6" fill="#3ddbc8"/>
    <rect x="320" y="185" width="140" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>

    <!-- KPI tiles -->
    <g>
      <rect x="140" y="206" width="100" height="42" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="150" y="216" width="38" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".6"/>
      <text x="150" y="239" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#eaf1f5">4.2 Cr</text>
      <text x="212" y="239" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#3ddbc8">▲ 12%</text>

      <rect x="250" y="206" width="100" height="42" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="260" y="216" width="38" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".6"/>
      <text x="260" y="239" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#eaf1f5">86.4%</text>
      <text x="312" y="239" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#3ddbc8">▲ 4%</text>

      <rect x="360" y="206" width="100" height="42" rx="9" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".10"/>
      <rect x="370" y="216" width="38" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".6"/>
      <text x="370" y="239" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#eaf1f5">1,248</text>
      <text x="418" y="239" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#f3b562">▼ 2%</text>
    </g>

    <!-- bar + line panel -->
    <rect x="140" y="258" width="196" height="128" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <g stroke="#ffffff" stroke-opacity=".07"><line x1="150" y1="290" x2="326" y2="290"/><line x1="150" y1="320" x2="326" y2="320"/><line x1="150" y1="350" x2="326" y2="350"/></g>
    <g fill="url(#bar)">
      <rect x="156" y="332" width="14" height="28" rx="3"/><rect x="178" y="318" width="14" height="42" rx="3"/>
      <rect x="200" y="326" width="14" height="34" rx="3"/><rect x="222" y="300" width="14" height="60" rx="3"/>
      <rect x="244" y="308" width="14" height="52" rx="3"/><rect x="266" y="288" width="14" height="72" rx="3"/>
      <rect x="288" y="296" width="14" height="64" rx="3"/><rect x="310" y="276" width="14" height="84" rx="3"/>
    </g>
    <path d="M163 322 L185 308 L207 316 L229 286 L251 296 L273 272 L295 280 L317 264 L317 360 L163 360 Z" fill="url(#area)"/>
    <polyline points="163,322 185,308 207,316 229,286 251,296 273,272 295,280 317,264" fill="none" stroke="#f3b562" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="317" cy="264" r="4.5" fill="#f3b562"/><circle cx="317" cy="264" r="9" fill="#f3b562" fill-opacity=".25"/>
    <rect x="152" y="366" width="60" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".45"/>

    <!-- donut panel -->
    <rect x="346" y="258" width="114" height="128" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(403 312) rotate(-90)" fill="none" stroke-width="13">
      <circle r="30" stroke="#ffffff" stroke-opacity=".08"/>
      <circle r="30" stroke="#3ddbc8" stroke-dasharray="86 188" stroke-linecap="round"/>
      <circle r="30" stroke="#6d9bff" stroke-dasharray="52 188" stroke-dashoffset="-92" stroke-linecap="round"/>
      <circle r="30" stroke="#f3b562" stroke-dasharray="34 188" stroke-dashoffset="-150" stroke-linecap="round"/>
    </g>
    <text x="403" y="317" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#eaf1f5">46%</text>
    <g font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#9db0bd">
      <circle cx="362" cy="360" r="3" fill="#3ddbc8"/><rect x="369" y="357" width="26" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".5"/>
      <circle cx="400" cy="360" r="3" fill="#6d9bff"/><rect x="407" y="357" width="20" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".5"/>
      <circle cx="362" cy="374" r="3" fill="#f3b562"/><rect x="369" y="371" width="30" height="5" rx="2.5" fill="#9db0bd" fill-opacity=".5"/>
    </g>

    <!-- floating glass cards -->
    <g filter="url(#soft)">
      <!-- top right: sparkline -->
      <rect x="392" y="84" width="122" height="74" rx="16" fill="url(#glassfill)" stroke="#ffffff" stroke-opacity=".30"/>
      <rect x="406" y="98" width="46" height="6" rx="3" fill="#ffffff" fill-opacity=".45"/>
      <polyline points="406,138 424,126 440,132 458,114 476,120 498,106" fill="none" stroke="#3ddbc8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="498" cy="106" r="3.6" fill="#3ddbc8"/>

      <!-- bottom left: mini bars -->
      <rect x="82" y="408" width="124" height="76" rx="16" fill="url(#glassfill)" stroke="#ffffff" stroke-opacity=".30"/>
      <rect x="96" y="420" width="40" height="6" rx="3" fill="#ffffff" fill-opacity=".45"/>
      <g fill="#6d9bff"><rect x="98" y="452" width="11" height="22" rx="2.5"/><rect x="115" y="444" width="11" height="30" rx="2.5"/><rect x="132" y="448" width="11" height="26" rx="2.5"/><rect x="149" y="436" width="11" height="38" rx="2.5"/></g>
      <rect x="166" y="430" width="11" height="44" rx="2.5" fill="#3ddbc8"/><rect x="183" y="442" width="11" height="32" rx="2.5" fill="#f3b562"/>

      <!-- top left: pie/percent -->
      <rect x="74" y="118" width="104" height="70" rx="16" fill="url(#glassfill)" stroke="#ffffff" stroke-opacity=".30"/>
      <g transform="translate(106 154) rotate(-90)" fill="none" stroke-width="8">
        <circle r="17" stroke="#ffffff" stroke-opacity=".15"/><circle r="17" stroke="#f3b562" stroke-dasharray="74 107" stroke-linecap="round"/>
      </g>
      <text x="106" y="158" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#eaf1f5">70</text>
      <rect x="132" y="142" width="32" height="6" rx="3" fill="#ffffff" fill-opacity=".45"/><rect x="132" y="158" width="22" height="6" rx="3" fill="#ffffff" fill-opacity=".25"/>

      <!-- bottom right: SQL / DAX chip card -->
      <rect x="396" y="418" width="118" height="66" rx="16" fill="url(#glassfill)" stroke="#ffffff" stroke-opacity=".30"/>
      <text x="410" y="444" font-family="Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#3ddbc8">SELECT</text>
      <text x="464" y="444" font-family="Consolas,Menlo,monospace" font-size="11" fill="#eaf1f5">sales</text>
      <text x="412" y="462" font-family="Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#6d9bff">DAX</text>
      <text x="446" y="462" font-family="Consolas,Menlo,monospace" font-size="11" fill="#f3b562">YoY %</text>
    </g>
  </g>

  <!-- outer ring -->
  <circle cx="300" cy="300" r="286" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="300" cy="300" r="295" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
